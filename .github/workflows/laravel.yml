name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: ${{ matrix.php }}
        coverage: none
    - name: Install Dependencies
      run: |
        composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
        composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
        composer update --no-interaction --no-progress --prefer-dist
    - name: Execute tests
      run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
        coverage: none
    - name: Install Dependencies
      run: composer update --no-interaction --no-progress --prefer-dist
    - name: Check code style
      run: vendor/bin/pint --test
    - name: Static analysis
      run: vendor/bin/phpstan analyse --no-progress
